<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>E6B Flight Computer</title>
<meta name="description" content="Offline electronic E6B: true airspeed, density altitude, wind triangle, weight and balance, nav log, holding entries and a METAR decoder.">
<meta name="theme-color" content="#0b1d33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="E6B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/e6b.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="back" type="button" aria-label="Back to the calculator list">‹</button>
    <h1 id="title">Flight computer</h1>
    <button id="gear" type="button" aria-label="Settings">⚙</button>
  </header>

  <main id="view"></main>

  <nav id="tabbar">
    <a href="#calc" data-tab="calc"><span class="ico" aria-hidden="true">🧮</span>Calc</a>
    <a href="#plan/navlog" data-tab="plan"><span class="ico" aria-hidden="true">🗺️</span>Plan</a>
    <a href="#wx/metar" data-tab="wx"><span class="ico" aria-hidden="true">🌤️</span>Wx</a>
    <a href="#timer" data-tab="timer"><span class="ico" aria-hidden="true">⏱️</span>Timer</a>
    <a href="#ref" data-tab="ref"><span class="ico" aria-hidden="true">📖</span>Ref</a>
  </nav>
</div>
<noscript><p style="padding:2rem;font:16px system-ui">This flight computer needs JavaScript. It runs entirely on your device — nothing is sent anywhere.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
