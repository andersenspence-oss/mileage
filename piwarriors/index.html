<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>PI Warriors Copy Studio</title>
<meta name="description" content="Writes a week of PI Warriors social copy for X, Facebook, LinkedIn and Instagram, sized to each platform, with hashtags and media suggestions.">
<meta name="theme-color" content="#2b3440">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PI Copy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <h1>PI Warriors Copy Studio</h1>
    <span class="badge">Beta</span>
  </header>

  <main id="view"></main>

  <nav id="tabbar">
    <a href="#write" data-tab="write"><span class="ico" aria-hidden="true">✍️</span>Write</a>
    <a href="#results" data-tab="results"><span class="ico" aria-hidden="true">📋</span>Results</a>
    <a href="#history" data-tab="history"><span class="ico" aria-hidden="true">🗂️</span>History</a>
    <a href="#settings" data-tab="settings"><span class="ico" aria-hidden="true">⚙️</span>Settings</a>
  </nav>
</div>
<noscript><p style="padding:2rem;font:16px system-ui">This app needs JavaScript.</p></noscript>
<script type="module" src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
</html>
